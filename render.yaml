# Render Blueprint — deploys the study as ONE web service (the React app and the
# API served together from one URL) PLUS a managed Postgres database that stores
# all participant data. Render reads this file when you create a "Blueprint" from
# this repo. See DEPLOY.md for the click-by-click guide, and
# https://render.com/docs/blueprint-spec for the full reference.
services:
  - type: web
    name: student-club-study
    runtime: docker
    # The branch Render builds and auto-deploys from. Change this if you later
    # merge the online version into main (or another branch).
    branch: online-version
    dockerfilePath: ./Dockerfile
    # "starter" keeps the web service awake (the Free plan sleeps after 15 min
    # idle and is slow to wake). Participant data lives in Postgres below, not on
    # this service's disk, so no persistent disk is needed here.
    plan: starter
    # Keep the web service and database in the same region. Frankfurt keeps data
    # in the EU (good for GDPR). If you're elsewhere, change BOTH to e.g. oregon.
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # REQUIRED. Paste your real key in the Render dashboard — never in git.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Lets you download collected data from a browser at
      #   https://<your-app>.onrender.com/api/admin/export?token=<this value>
      # Render generates a strong random value; find it under Environment.
      - key: ADMIN_TOKEN
        generateValue: true
      # The model every condition uses (see backend/llm.py). Optional override.
      - key: STUDY_MODEL
        value: claude-sonnet-4-6
      # Render fills this in automatically from the database below — do NOT type
      # a password anywhere. The backend reads DATABASE_URL to store all data.
      - key: DATABASE_URL
        fromDatabase:
          name: student-club-study-db
          property: connectionString

databases:
  - name: student-club-study-db
    databaseName: study_logs
    user: study_user
    # Cheapest paid Postgres plan (~$6/mo) — keeps your data and offers backups.
    # A Free database also exists for testing but Render expires it after ~30
    # days; if Render rejects this value, pick any "Basic" plan in the dashboard.
    plan: basic-256mb
    region: frankfurt
